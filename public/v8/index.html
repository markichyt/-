<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="ConsultantLM Quiz Funnel — бета-дизайн для внутрішнього перегляду: кликабельний mobile-first прототип за ТЗ, нотатки до кожного екрана, карта воронки.">
<title>ConsultantLM Quiz Funnel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDF0F5; --panel:#FFFFFF; --panel2:#F5F7FA; --line:#D6DDE8; --line2:#E6EAF1;
  --text:#0F1B2D; --muted:#5D6B80; --faint:#8C98AB;
  --brand:#0B1F3A; --brand-ink:#FFFFFF; --brand-soft:#E4EBF6;
  --amber:#E9A23B; --green:#1B8F5A; --violet:#5B4BD6; --focus:#2456F0;
  --bezel:#0B0F17; --shadow:0 30px 80px rgba(11,31,58,.22);
  --ff-h:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ff-b:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ff-m:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* product palette inside the phone: fixed, not theme-dependent */
  --p-bg:#F4F6FA; --p-surface:#FFFFFF; --p-line:#E1E6EF; --p-text:#0F1B2D; --p-muted:#5D6B80; --p-faint:#94A0B4;
  --p-navy:#0B1F3A; --p-navy-2:#152C52; --p-navy-bg:#EAF0FA; --p-amber:#E9A23B; --p-amber-bg:#FBF1DF;
  --p-green:#1B8F5A; --p-green-bg:#E3F4EB; --p-violet:#5B4BD6; --p-violet-bg:#EFEDFC;
  --p-dark:#0B1F3A; --p-dark-2:#10294F; --p-on-dark:#FFFFFF; --p-on-dark-muted:rgba(255,255,255,.68); --p-dark-line:rgba(255,255,255,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F19; --panel:#111827; --panel2:#161F30; --line:#26314A; --line2:#1E2739;
    --text:#E7ECF4; --muted:#9AA7BC; --faint:#6B7891;
    --brand:#4A7BE6; --brand-ink:#FFFFFF; --brand-soft:#17284A;
    --bezel:#000; --shadow:0 30px 80px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F19; --panel:#111827; --panel2:#161F30; --line:#26314A; --line2:#1E2739;
  --text:#E7ECF4; --muted:#9AA7BC; --faint:#6B7891;
  --brand:#4A7BE6; --brand-ink:#FFFFFF; --brand-soft:#17284A;
  --bezel:#000; --shadow:0 30px 80px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ff-b);font-size:14px;line-height:1.45;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--ff-h);margin:0;text-wrap:balance}
.mono{font-family:var(--ff-m)}

/* ---------- shell ---------- */
.bar{display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;font-family:var(--ff-h)}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px;font-weight:600}
.ver{font-family:var(--ff-m);font-size:11px;padding:2px 7px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.modes{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.modes button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--muted)}
.modes button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.legend{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .dyn-key{border-bottom:2px dotted var(--amber);color:var(--text)}
.bar .ghost{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px}
.bar .ghost:hover{background:var(--panel2)}

.wrap{display:grid;grid-template-columns:270px minmax(0,1fr) 360px;gap:0;height:calc(100vh - 57px);min-height:600px}
.nav{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px 10px 30px}
.nav .grp{font-family:var(--ff-h);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav .grp:first-child{padding-top:4px}
.nav button.item{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:9px;color:var(--text)}
.nav button.item:hover{background:var(--panel2)}
.nav button.item.on{background:var(--brand-soft)}
.nav .num{font-family:var(--ff-m);font-size:11px;color:var(--muted);text-align:center;border:1px solid var(--line);border-radius:6px;padding:2px 0}
.nav .item.on .num{border-color:var(--brand);color:var(--brand)}
.nav .lbl{font-size:13px;font-weight:500;line-height:1.25}
.nav .lbl small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:1px}
.nav .flags{display:flex;gap:4px;align-items:center}
.kind{display:inline-block;width:8px;height:8px;border-radius:50%}
.kind.q{background:var(--brand)} .kind.p{background:var(--amber)} .kind.x{background:var(--green)} .kind.a{background:var(--violet)}
.rem{width:16px;height:16px;border-radius:50%;background:var(--amber);color:#1a1200;font-size:10px;font-weight:700;display:inline-grid;place-items:center;font-family:var(--ff-m)}

.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:
 radial-gradient(1200px 600px at 50% 120%, var(--brand-soft), transparent 60%), var(--bg)}
.phone-wrap{transform-origin:center center;position:relative}
.phone{width:390px;height:844px;border-radius:52px;background:var(--bezel);padding:11px;box-shadow:var(--shadow);position:relative}
.phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:var(--bezel);border-radius:20px;z-index:3}
.screen{width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--p-bg);color:var(--p-text);position:relative;font-family:var(--ff-b)}
.stage-ctl{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.stage-ctl button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 10px;font-weight:600;font-size:12px}
.stage-ctl button:hover{background:var(--panel2)}
.stage-ctl .pos{font-family:var(--ff-m);padding:0 6px}
.stage-hint{position:absolute;top:14px;right:16px;font-size:11px;color:var(--faint)}

.notes{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:18px 20px 30px;display:flex;flex-direction:column;gap:16px}
.notes .eyebrow{display:flex;align-items:center;gap:8px;font-family:var(--ff-m);font-size:11px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;font-family:var(--ff-h);letter-spacing:.02em}
.chip.q{background:var(--brand-soft);color:var(--brand)} .chip.p{background:#FBF1DF;color:#8A5A0C} .chip.x{background:#E3F4EB;color:#136B43} .chip.a{background:#EFEDFC;color:#4437B0}
:root[data-theme="dark"] .chip.p,:root[data-theme="dark"] .chip.x,:root[data-theme="dark"] .chip.a{filter:brightness(.85) saturate(.9)}
.notes h2{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.notes h3{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.notes p{margin:0;color:var(--text)}
.notes ul{margin:0;padding-left:16px;display:grid;gap:4px}
.notes .data{display:flex;flex-wrap:wrap;gap:6px}
.notes .data span{font-family:var(--ff-m);font-size:11px;padding:3px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.notes .rule{border-left:3px solid var(--amber);padding:6px 10px;background:var(--panel2);border-radius:0 8px 8px 0;font-size:13px}
.notes textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:var(--panel2);color:var(--text)}
.notes .saved{font-size:11px;color:var(--faint);margin-top:4px;min-height:14px}

/* ---------- map mode ---------- */
.map{padding:22px 26px 60px;display:grid;gap:22px}
.map .row{display:grid;gap:12px}
.map .rowhead{display:flex;align-items:baseline;gap:12px}
.map .rowhead h2{font-size:15px;font-weight:800}
.map .rowhead p{margin:0;color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.tile{border:0;background:transparent;padding:0;text-align:left;display:grid;gap:8px;color:var(--text)}
.tile .mini{width:100%;aspect-ratio:390/844;border-radius:14px;overflow:hidden;background:var(--bezel);padding:3px;position:relative;box-shadow:0 8px 24px rgba(11,31,58,.18);transition:transform .15s}
.tile:hover .mini{transform:translateY(-3px)}
.tile .mini .screen{border-radius:12px;width:390px;height:844px;transform-origin:0 0;position:absolute;top:3px;left:3px}
.tile .cap{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:start;font-size:12px;line-height:1.3}
.tile .cap .num{font-family:var(--ff-m);color:var(--muted);font-size:11px}
.tile .cap b{font-weight:600;font-family:var(--ff-b)}
.tile .cap small{display:block;color:var(--muted)}
.side{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.score{display:grid;gap:6px;font-size:13px}
.score div{display:grid;grid-template-columns:1fr auto;gap:10px;padding:5px 0;border-bottom:1px solid var(--line2)}
.score div:last-child{border:0}
.score .mono{color:var(--muted)}
.tiers{display:flex;gap:8px;margin-top:8px}
.tiers span{flex:1;padding:6px 8px;border-radius:8px;font-family:var(--ff-m);font-size:11px;text-align:center;font-weight:600}
.arch{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;align-items:center}
.arch span{padding:4px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line2)}
.arch i{color:var(--faint);font-style:normal}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:1180px){
  .wrap{grid-template-columns:230px minmax(0,1fr) 320px}
}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr;height:auto;min-height:0}
  .nav{display:none}
  .brand span:not(.ver){display:none}
  .stage-hint{display:none}
  .bar{gap:10px}
  .stage{height:calc(100vh - 57px);min-height:560px}
  .notes{border-left:0;border-top:1px solid var(--line)}
  .legend{display:none}
}
@media (prefers-reduced-motion: reduce){
  .screen *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
/* ---------- product UI inside the phone ---------- */
.scr{height:100%;display:flex;flex-direction:column;background:var(--p-bg);color:var(--p-text)}
.scr.dark{background:linear-gradient(180deg,var(--p-dark-2) 0%,var(--p-dark) 60%);color:var(--p-on-dark)}
.status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-family:var(--ff-h);font-weight:700;font-size:14px;flex:none}
.status .ic{display:flex;gap:5px;align-items:center}
.status .ic i{display:inline-block;width:16px;height:10px;border:1.5px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.status .ic i::after{content:"";position:absolute;inset:1.5px;right:4px;background:currentColor;border-radius:1px}
.top{padding:6px 22px 4px;flex:none}
.prog{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--p-muted);margin-bottom:8px;font-family:var(--ff-h)}
.dark .prog{color:var(--p-on-dark-muted)}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.segs i{height:4px;border-radius:2px;background:var(--p-line)}
.segs i.on{background:var(--p-navy)}
.dark .segs i{background:var(--p-dark-line)} .dark .segs i.on{background:var(--p-amber)}
.body{flex:1;overflow-y:auto;padding:10px 22px 16px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.body.center{justify-content:center}
.foot{flex:none;padding:10px 22px 26px;background:linear-gradient(180deg,rgba(244,246,250,0),var(--p-bg) 30%)}
.dark .foot{background:linear-gradient(180deg,rgba(11,31,58,0),var(--p-dark) 30%)}
.foot .micro{text-align:center;font-size:12px;color:var(--p-muted);margin-top:8px}
.dark .foot .micro{color:var(--p-on-dark-muted)}
.eyeb{font-family:var(--ff-h);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--p-amber)}
.h1{font-size:25px;font-weight:800;line-height:1.15;letter-spacing:-.015em}
.h2{font-size:20px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.sub{font-size:15px;line-height:1.45;color:var(--p-muted);margin:0}
.dark .sub{color:var(--p-on-dark-muted)}
.small{font-size:12px;color:var(--p-muted)} .dark .small{color:var(--p-on-dark-muted)}
.dyn{border-bottom:2px dotted var(--p-amber);padding-bottom:1px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;border:0;background:var(--p-navy);color:#fff;font-family:var(--ff-h);font-weight:700;font-size:15.5px;letter-spacing:-.005em}
.btn:active{transform:scale(.99)}
.btn.sec{background:transparent;border:1.5px solid var(--p-line);color:var(--p-text);height:46px;font-weight:600;margin-top:8px}
.dark .btn{background:#fff;color:var(--p-navy)}
.dark .btn.sec{border-color:var(--p-dark-line);color:#fff;background:transparent}
.btn.amber{background:var(--p-amber);color:#1b1200}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{background:none;border:0;color:var(--p-navy);font-weight:600;font-size:13px;padding:0;text-decoration:underline;text-underline-offset:3px}
.dark .link{color:#fff}

.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--p-surface);border:1.5px solid var(--p-line);border-radius:14px;padding:13px 14px;font-size:15px;font-weight:500;color:var(--p-text)}
.opt .r{width:20px;height:20px;border-radius:50%;border:2px solid var(--p-faint);flex:none;position:relative}
.opt.on{border-color:var(--p-navy);background:var(--p-navy-bg)}
.opt.on .r{border-color:var(--p-navy)} .opt.on .r::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--p-navy)}
.opt .t{display:grid;gap:2px}
.opt .t small{font-size:12.5px;font-weight:400;color:var(--p-muted);line-height:1.35}
.opt.muted{border-style:dashed}
.hint{background:var(--p-navy-bg);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--p-navy);display:flex;gap:8px;align-items:flex-start}
.hint b{font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{background:var(--p-surface);border:1.5px solid var(--p-line);border-radius:12px;padding:12px 12px;text-align:left;font-size:14px;font-weight:600;line-height:1.25;color:var(--p-text);display:grid;gap:6px}
.cat i{display:block;width:26px;height:26px;border-radius:8px;background:var(--p-navy-bg)}
.cat.on{border-color:var(--p-navy);background:var(--p-navy-bg)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:1.5px solid var(--p-line);background:var(--p-surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--p-text)}
.pill.on{border-color:var(--p-navy);background:var(--p-navy);color:#fff}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--p-surface);border:1.5px solid var(--p-line);border-radius:12px;padding:3px;gap:3px}
.seg2 button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:600;color:var(--p-muted)}
.seg2 button.on{background:var(--p-navy);color:#fff}
.field{display:grid;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--p-muted)}
.inp{display:flex;align-items:center;gap:10px;width:100%;background:var(--p-surface);border:1.5px solid var(--p-line);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--p-text);min-height:48px}
.inp .ph{color:var(--p-faint)}
.inp.ta{min-height:128px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.sugg{background:var(--p-surface);border:1.5px solid var(--p-line);border-radius:12px;overflow:hidden;margin-top:-6px}
.sugg button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:transparent;padding:11px 14px;border-bottom:1px solid var(--p-line);font-size:14.5px}
.sugg button:last-child{border-bottom:0} .sugg button small{color:var(--p-faint)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--p-text)}
.chk i{width:20px;height:20px;border-radius:6px;border:2px solid var(--p-faint);flex:none;display:grid;place-items:center;font-size:12px;color:#fff;font-style:normal;margin-top:1px}
.chk.on i{background:var(--p-navy);border-color:var(--p-navy)}
.attach{display:flex;align-items:center;gap:12px;background:var(--p-surface);border:1.5px dashed var(--p-line);border-radius:12px;padding:12px 14px;width:100%;text-align:left}
.attach .ico{width:36px;height:36px;border-radius:10px;background:var(--p-navy-bg);display:grid;place-items:center;flex:none;font-size:16px}
.attach .t{font-size:14px;font-weight:600} .attach .t small{display:block;font-weight:400;font-size:12px;color:var(--p-muted);margin-top:2px}
.file{display:flex;align-items:center;gap:8px;font-size:12.5px;background:var(--p-green-bg);color:#125A38;border-radius:8px;padding:6px 10px;width:max-content}

.vals{display:grid;gap:10px}
.vals div{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:500}
.tick{width:22px;height:22px;border-radius:50%;background:var(--p-green-bg);color:var(--p-green);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.dark .tick{background:rgba(255,255,255,.14);color:#fff}

/* hero illustration on slide 0 */
.hero{position:relative;height:210px;margin:6px -22px 0;overflow:hidden;flex:none}
.hero .flow{position:absolute;left:22px;top:14px;display:flex;flex-direction:column;gap:8px;font-family:var(--ff-h);font-size:11px;font-weight:700}
.hero .flow span{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;background:var(--p-surface);border:1px solid var(--p-line);color:var(--p-navy);width:max-content;box-shadow:0 4px 12px rgba(11,31,58,.06)}
.hero .flow span.ai{background:var(--p-violet-bg);color:var(--p-violet);border-color:transparent}
.hero .flow em{font-style:normal;color:var(--p-faint);padding-left:12px;font-size:10px}
.hero .ph{position:absolute;right:26px;top:10px;width:190px;height:260px;border-radius:26px;background:var(--p-navy);padding:8px;box-shadow:0 20px 40px rgba(11,31,58,.25)}
.hero .ph .in{background:var(--p-surface);border-radius:20px;height:100%;padding:16px 12px;display:grid;gap:10px;align-content:start}
.ans{display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:start}

/* ===================== APP LOGIC ===================== */
let cur = 0, timer = null;
const $ = (s,r=document)=>r.querySelector(s);
const screenEl = $('#screen'), navEl = $('#nav'), notesEl = $('#notes'), mapEl = $('#map');
const GROUPS = {entry:'Вхід', quiz:'Квіз · 6 кроків + proof', app:'Застосунок після переходу'};
const KINDN = {q:'Питання',p:'Proof',x:'Обробка / CTA',a:'App'};
const REM_KEY = 'clm_quiz_remarks_v1';
let remarks = {}; try{ remarks = JSON.parse(localStorage.getItem(REM_KEY)||'{}')||{} }catch(e){ remarks = {} }
const saveRem = ()=>{ try{ localStorage.setItem(REM_KEY, JSON.stringify(remarks)) }catch(e){} };

function renderScreen(){
  clearTimeout(timer);
  const sc = SCREENS[cur];
  screenEl.innerHTML = sc.render({static:false});
  const body = $('.body',screenEl); if(body) body.scrollTop = 0;
  const proc = $('[data-proc]',screenEl);
  if(proc){
    const items=[...proc.children];
    items.forEach((it,i)=>{ setTimeout(()=>{ items.forEach(x=>x.classList.remove('now')); if(i<items.length-1){it.classList.add('done')} else {it.classList.add('now')} }, 350+i*650) });
  }
  if(sc.auto){ timer=setTimeout(()=>go(cur+1), sc.auto) }
  $('#pos').textContent = `${cur} / ${SCREENS.length-1}`;
  $('#prevBtn').disabled = cur===0; $('#nextBtn').disabled = cur===SCREENS.length-1;
  renderNav(); renderNotes();
}
function go(n){ if(n<0||n>=SCREENS.length) return; cur=n; renderScreen(); }

function renderNav(){
  let html='', g='';
  SCREENS.forEach((sc,i)=>{
    if(sc.grp!==g){ g=sc.grp; html+=`<div class="grp">${GROUPS[g]}</div>` }
    const r = (remarks[sc.tz]||'').trim();
    html+=`<button class="item ${i===cur?'on':''}" data-nav="${i}"><span class="num">${sc.tz}</span><span class="lbl">${sc.title}<small>${sc.short}${sc.step?` · крок ${sc.step}/6`:''}${sc.cond?` · ${sc.cond}`:''}</small></span><span class="flags">${r?'<span class="rem">!</span>':''}<span class="kind ${sc.kind}"></span></span></button>`;
  });
  navEl.innerHTML = html;
}
function renderNotes(){
  const sc = SCREENS[cur];
  notesEl.innerHTML = `
   <div class="eyebrow">СЛАЙД ${sc.tz} з ТЗ <span class="chip ${sc.kind}">${KINDN[sc.kind]}</span>${sc.step?`<span class="chip q">Крок ${sc.step} із 6</span>`:''}${sc.anim?`<span class="chip x">анімація</span>`:''}</div>
   <h2>${sc.title}</h2>
   <div><h3>Мета екрана</h3><p>${sc.goal}</p></div>
   ${sc.rules&&sc.rules.length?`<div><h3>Важливо з ТЗ</h3><div style="display:grid;gap:6px">${sc.rules.map(r=>`<div class="rule">${r}</div>`).join('')}</div></div>`:''}
   <div><h3>Дані → CRM</h3>${sc.data&&sc.data.length?`<div class="data">${sc.data.map(d=>`<span>${d}</span>`).join('')}</div>`:'<p class="small" style="color:var(--muted)">Екран не збирає даних</p>'}</div>
   <div><h3>Зауваження до екрана</h3><textarea id="remark" placeholder="Що змінити, що уточнити, що не так… Зберігається у вашому браузері; кнопка зверху збирає всі зауваження в один текст.">${esc(remarks[sc.tz]||'')}</textarea><div class="saved" id="savedMsg"></div></div>`;
  const ta = $('#remark'); let t;
  ta.addEventListener('input',()=>{ remarks[sc.tz]=ta.value; saveRem(); $('#savedMsg').textContent='Збережено'; clearTimeout(t); t=setTimeout(()=>{$('#savedMsg').textContent=''},1200); renderNav(); });
}

/* interactions inside the phone */
screenEl.addEventListener('click',e=>{
  const b = e.target.closest('[data-set],[data-toggle],[data-act],[data-go]'); if(!b) return;
  if(b.dataset.go!==undefined){ go(+b.dataset.go); return }
  if(b.dataset.set){
    const k=b.dataset.set, v=b.dataset.val;
    if(k==='country'){ S.country=v; S.city=null }
    else if(k==='category'){ S.category=v; S.sub=null }
    else if(k==='city'){ S.city=v||null }
    else S[k]=v;
    renderScreen(); return;
  }
  if(b.dataset.toggle){
    const k=b.dataset.toggle;
    if(k==='desc'){ S.desc = S.desc?'':'Ми вирішили розлучитися, є двоє дітей (6 і 9 років). Не можемо домовитися про опіку та поділ квартири в Майамі.' }
    else if(k==='files'){ S.files = S.files?0:1 }
    else S[k]=!S[k];
    renderScreen(); return;
  }
  const a=b.dataset.act;
  if(a==='next') go(cur+1);
  else if(a==='member'){ S.member=true; go(14) }
  else if(a==='go15') go(15);
});
$('#prevBtn').onclick=()=>go(cur-1); $('#nextBtn').onclick=()=>go(cur+1);
$('#resetBtn').onclick=()=>{ Object.assign(S,{specialist:null,country:'USA',city:null,remote:false,category:null,sub:null,desc:'',files:0,voice:false,intent:null,member:false,consent:false,pref:'WhatsApp'}); go(0) };
navEl.addEventListener('click',e=>{ const b=e.target.closest('[data-nav]'); if(b) go(+b.dataset.nav) });
document.addEventListener('keydown',e=>{ if(e.target.matches('textarea,input')) return; if(e.key==='ArrowRight') go(cur+1); if(e.key==='ArrowLeft') go(cur-1) });

/* fit phone into stage */
function fit(){ const st=$('.stage'); const h=st.clientHeight-70, w=st.clientWidth-40; const s=Math.min(1,h/844,w/390); $('#phoneWrap').style.transform=`scale(${s})`; }
window.addEventListener('resize',fit);

/* map mode */
function renderMap(){
  const groups=[['entry','Вхід','Трафік: кейс / стаття / соцмережі → FREE CASE ANALYSIS'],['quiz','Квіз','6 питань, між ними — короткі proof-екрани. Question → Proof → Question → Proof.'],['app','Застосунок','Continuity: одразу у свій кейс. AI → адвокати → профілі → послуги → вибір.']];
  let html='';
  groups.forEach(([g,t,d])=>{
    html+=`<section class="row"><div class="rowhead"><h2>${t}</h2><p>${d}</p></div><div class="tiles">`;
    SCREENS.forEach((sc,i)=>{ if(sc.grp!==g) return; const r=(remarks[sc.tz]||'').trim();
      html+=`<button class="tile" data-open="${i}"><div class="mini"><div class="screen">${sc.render({static:true})}</div></div><div class="cap"><span class="num">${sc.tz}</span><span><b>${sc.title}</b><small>${sc.short}${sc.step?` · крок ${sc.step}/6`:''}</small></span><span class="flags">${r?'<span class="rem">!</span>':''}<span class="kind ${sc.kind}"></span></span></div></button>`;
    });
    html+=`</div></section>`;
  });
  html+=`<section class="side">
    <div class="card"><h3>Lead scoring (з ТЗ)</h3><div class="score">
      <div><span>Intent · need now / considering / research</span><span class="mono">30 / 20 / 5</span></div>
      <div><span>Membership · paid</span><span class="mono">25</span></div>
      <div><span>Case completeness · description+docs / detailed / minimal</span><span class="mono">15 / 10 / 3</span></div>
      <div><span>Contact quality · phone+email verified / one</span><span class="mono">10 / 5</span></div>
      <div><span>Category / value (configurable)</span><span class="mono">до 10</span></div>
      <div><span>Engagement · app opened, answer read, profile, service</span><span class="mono">до 10</span></div></div>
      <div class="tiers"><span style="background:#FBE3E0;color:#8B2A1E">HOT 70–100</span><span style="background:#FBF1DF;color:#8A5A0C">WARM 40–69</span><span style="background:var(--brand-soft);color:var(--brand)">NURTURE 0–39</span></div>
      <p class="small" style="margin:10px 0 0;color:var(--muted)">PREPAID MEMBER — окремий статус, не заміна Lead Score.</p></div>
    <div class="card"><h3>Фінальна архітектура</h3><div class="arch">${['Traffic','FREE CASE ANALYSIS','Q1 Specialist','Expertise proof','Q2 Location','Availability proof','Q3 Category','Similar cases proof','Q4 Description + docs','AI processing','Multiple opinions','Specialist comparison','Q5 Intent','Transparent pricing','Membership upsell','Q6 Contact','Case created','APP','AI answers','Lawyer answers','Profiles + reviews','Service + stages + price','CLIENT COMPARES','CLIENT CHOOSES','Direct communication','Service purchase'].map(x=>`<span>${x}</span>`).join('<i>→</i>')}</div>
      <p class="small" style="margin:12px 0 0;color:var(--muted)">Що НЕ робити: не 15 питань, не фейкові цифри, не змішувати AI і адвокатів, не робити Membership обов’язковим, не ставити довгий pitch перед кожним питанням.</p></div>
   </section>`;
  mapEl.innerHTML=html;
  mapEl.querySelectorAll('.tile .mini').forEach(m=>{ const s=m.clientWidth-6; const sc=$('.screen',m); sc.style.transform=`scale(${s/390})`; });
}
mapEl.addEventListener('click',e=>{ const b=e.target.closest('[data-open]'); if(b){ setMode('proto'); go(+b.dataset.open) } });
function setMode(m){
  document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  $('#proto').hidden = m!=='proto'; mapEl.hidden = m!=='map';
  if(m==='map'){ clearTimeout(timer); renderMap() } else { requestAnimationFrame(()=>{fit(); renderScreen()}) }
}
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
window.addEventListener('resize',()=>{ if(!mapEl.hidden) mapEl.querySelectorAll('.tile .mini').forEach(m=>{ const s=m.clientWidth-6; $('.screen',m).style.transform=`scale(${s/390})` }) });

/* copy remarks */
$('#copyAll').onclick=async()=>{
  const lines=SCREENS.filter(s=>(remarks[s.tz]||'').trim()).map(s=>`Слайд ${s.tz} — ${s.title}:\n${remarks[s.tz].trim()}`);
  const text = lines.length?`Зауваження до ConsultantLM Quiz Funnel (бета-дизайн v0.1)\n\n${lines.join('\n\n')}`:'Зауважень поки немає.';
  try{ await navigator.clipboard.writeText(text); toast(lines.length?`Скопійовано: ${lines.length} ${lines.length===1?'зауваження':'зауважень'}`:'Зауважень поки немає') }catch(e){ toast('Не вдалося скопіювати — виділіть текст у полях вручну') }
};
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200) }

fit(); renderScreen();
</script>
