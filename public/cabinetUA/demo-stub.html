<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сторінка поза знімком — демо кабінету</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<style>
@font-face{font-family:AvenirNextCyr;src:url(assets/cabinet/fonts/AvenirNextCyr-Regular.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:AvenirNextCyr;src:url(assets/cabinet/fonts/AvenirNextCyr-Demi.woff) format("woff");font-weight:600;font-display:swap}
@font-face{font-family:AvenirNextCyr;src:url(assets/cabinet/fonts/AvenirNextCyr-Bold.woff) format("woff");font-weight:700;font-display:swap}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
     background:#f4f7f9;font-family:AvenirNextCyr,"Avenir Next",Arial,sans-serif;color:#2c2c2c}
.sb{max-width:560px;background:#fff;border-radius:4px;box-shadow:0 2px 14px rgba(6,32,44,.1);padding:34px 34px 30px;text-align:center}
.sb__ico{width:54px;height:54px;margin:0 auto 18px;border-radius:50%;background:rgba(19,151,214,.1);
         display:flex;align-items:center;justify-content:center;font-size:24px;color:#1397d6;font-weight:700}
.sb__title{font-size:19px;font-weight:700;margin:0 0 10px}
.sb__path{display:inline-block;font-size:12.5px;color:#1397d6;background:rgba(19,151,214,.08);
          padding:5px 12px;border-radius:3px;margin-bottom:14px;word-break:break-all}
.sb__text{font-size:14px;line-height:1.65;color:#686868;margin:0 0 22px}
.sb__row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sb__btn{text-decoration:none;font-size:13.5px;font-weight:600;padding:11px 22px;border-radius:3px;transition:.2s}
.sb__btn--p{background:#1397d6;color:#fff}
.sb__btn--p:hover{background:#0f7fb4}
.sb__btn--g{border:1px solid #d7dfe5;color:#2c2c2c}
.sb__btn--g:hover{border-color:#1397d6;color:#1397d6}
</style>
</head>
<body>
<div class="sb">
  <div class="sb__ico">i</div>
  <h1 class="sb__title" id="ttl">Цієї сторінки немає в демо</h1>
  <div class="sb__path" id="pth"></div>
  <p class="sb__text">Демо зібране зі знімка кабінету — у ньому 25 сторінок. Ця адреса існує на бойовому сайті, але в знімок не потрапила: вона або вимагає відповіді сервера, або відкривається лише за певної дії користувача.</p>
  <div class="sb__row">
    <a class="sb__btn sb__btn--p" href="applications-relevant.html">До кабінету</a>
    <a class="sb__btn sb__btn--g" href="index.html">Усі розділи демо</a>
  </div>
</div>
<script>
(function(){
  var TITLES={
    "cabinet-rating-activity":"Рейтинг: активність",
    "cabinet-rating-common":"Рейтинг: загальний",
    "cabinet-rating-customer":"Рейтинг: відгуки клієнтів",
    "cabinet-rating-earning":"Рейтинг: заробіток",
    "cabinet-logout":"Вихід із кабінету",
    "cabinet-questionnaires":"Анкети"
  };
  var p=new URLSearchParams(location.search).get("p")||"";
  if(TITLES[p]) document.getElementById("ttl").textContent=TITLES[p]+" — немає в демо";
  document.getElementById("pth").textContent="/"+p.replace(/-/g,"/");
})();
</script>
</body>
</html>
